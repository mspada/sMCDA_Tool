name: Deploy to shinyapps.io

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["R-CMD-check"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: shinyapps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::renv
            any::rsconnect

      - name: Restore renv lockfile
        run: |
          Rscript -e "renv::consent(provided = TRUE)"
          Rscript -e "renv::restore(lockfile = 'renv.lock', prompt = FALSE)"

      - name: Deploy app
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APPNAME: sMCDATool
        run: |
          Rscript -e " \
            required <- c('SHINYAPPS_NAME', 'SHINYAPPS_TOKEN', 'SHINYAPPS_SECRET'); \
            missing <- required[!nzchar(Sys.getenv(required))]; \
            if (length(missing)) stop('Missing GitHub secret(s): ', paste(missing, collapse = ', ')); \
            rsconnect::setAccountInfo( \
              name = Sys.getenv('SHINYAPPS_NAME'), \
              token = Sys.getenv('SHINYAPPS_TOKEN'), \
              secret = Sys.getenv('SHINYAPPS_SECRET') \
            ); \
            rsconnect::deployApp( \
              appDir = 'inst/app', \
              appPrimaryDoc = 'app.R', \
              appName = Sys.getenv('SHINYAPPS_APPNAME'), \
              account = Sys.getenv('SHINYAPPS_NAME'), \
              launch.browser = FALSE, \
              forceUpdate = TRUE \
            ) \
          "
